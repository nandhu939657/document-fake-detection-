services:
  - type: web
    name: veritylens
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Confirmed via Render's docs (render.com/docs/compute-plans): free and
    # starter tiers cap at 512MB RAM, and "standard" is only 2GB -- a loaded
    # llama3.2:3b model alone typically needs ~3-4GB resident, plus overhead
    # for the Python/PyTorch subprocess. "pro" (2 CPU / 4GB RAM) is the
    # minimum tier likely to actually run this without OOM-crashing; even
    # that may be tight under concurrent requests. Check render.com/pricing
    # for the current monthly cost of this tier before deploying.
    plan: pro
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
